<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image recreating</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <style>
        body {
            background-image: url("../video/bg\ image.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        } 
        form{
            background-color: rgb(92, 92, 154);
            color: darkgrey;
        }

    </style>
</head>
    
<body >

    <div class="container mt-5 mb-5 ">
        <div class="row align-items-center justify-content-center g-0 w-100">
            <div class="col-6  text-center">
                <img src="../video/laptop image.jpg"  alt="laptop" class="img-fluid rounded ">
            </div>

            <div class="col-6 ">

                <form class="border border-primary rounded p-4 ">

                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" placeholder="Full name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Company Name</label>
                        <input type="text" class="form-control" placeholder="Company name" >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone No</label>
                        <input type="tel" class="form-control" min="10" placeholder="Phone number">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="Enter your mail address">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Message subject</label>
                        <input type="text" class="form-control" placeholder="describe the subject of your message" >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="2" placeholder="Write your message here"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Send Message
                    </button>

                </form>

            </div>
         </div>
        </div>
</body>

</html>
