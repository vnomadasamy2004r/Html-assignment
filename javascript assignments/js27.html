    <script>
    let str = "car scooty bike bike scooty";
    let words = str.split(" ");
    let map = new Map();
      for (let word of words) {
        if (map.has(word)) {
        map.set(word, map.get(word) + 1);
    } 
        else {
        map.set(word, 1);
    }
}
       console.log(map);
    </script>
