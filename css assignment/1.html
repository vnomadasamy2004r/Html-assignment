<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css methods</title>
    <link rel="stylesheet" href="1.css">
    <style>
        .internal {
            background-color: lightblue;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h2 style="color: red;">Inline CSS</h2>

    <section style="background-color: lightyellow; padding: 20px;">
        This section uses Inline CSS.
    </section>

    <h2>Internal CSS</h2>
    <section class="internal">
        This section uses Internal CSS.
    </section>

    <h2 class="external">External CSS</h2>
    <section class="external">
        This section uses External CSS.
    </section>
</body>
</html>
