    <script>
    function vowels(string) {
    let count = 0;

    for (let i = 0; i < string.length; i++) {
        if ("aeiou".includes(string[i])) {
            count++;
        }
    }
    return count;
}
console.log(vowels("hi my name is vinotha"));
</script>
