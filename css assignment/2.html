<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product card</title>
    <style>
        h3,p{
            background-color: rgb(255, 240, 240);
        }
        .card > p {
            background-color: rgb(198, 216, 233);
        }
            .card{
            width: 250px;
            text-align: center;
            box-shadow: 1px 2px 10px 1px;
            padding: 2px 3px 20px 10px ;
        }  
    </style>
</head>
<body>
   <div>
    <section class="card">
    <img src="../video/red-cosmetic-bottle-with-splash-design.png" alt="shampoo" width="250px" height="300px">
    <h3>magicia shampoo</h3>
    <h2> $40</h2>
    <p><i>soft, refreshing, silky, shiny hair</i></p>
    <p><i>in just two wash</i></p>
    <button class="button" style="background-color: brown; height: 40px;width: 100px;">Add to Cart</button>
    </section>
    </div>
    
</body>
</html>
