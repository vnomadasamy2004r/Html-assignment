<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="script.js"></script>
</head>
<body>
      <div class="container mt-3 p-3" style="max-width: 500px;">
        <h2 class="text-center p-3">Student Registration</h2>

        <form id="studentForm">

            <label class="form-label 3">Student Name:</label>
            <input type="text" id="studentName" class="form-control" placeholder="Enter name" required>

            <p id="nameDisplay"></p>

            <label class="form-label">Email:</label>
            <input type="email" id="email" class="form-control" placeholder="Enter email" required>

            <label class="form-label">Department:</label>
            <select id="department" class="form-control" required>
                <option value="">Select Department</option>
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="IT">IT</option>
                <option value="EEE">EEE</option>
            </select>

            <p id="deptDisplay"></p>

            <button type="submit" class="btn btn-primary w-100">Register</button>

        </form>

        <div id="result"></div>
    </div>

</body>
</body>
</html>
